server:
  port: 9000

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive.function.client.ExchangeFunctions: TRACE
    reactor.netty.http.server.HttpServer: DEBUG

spring:
  cloud:
    gateway:
      routes:
        # Auth Service
        - id: auth-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/auth/**

        # Product Service
        - id: product-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/products/**
          filters:
            - name: JwtAuthFilter

        # Order Service
        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/orders/**
          filters:
            - name: JwtAuthFilter

        # Inventory Service
        - id: inventory-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/inventory/**
          filters:
            - name: JwtAuthFilter

jwt:
  secret: mysecretkeymysecretkeymysecretkeymysecretkey
